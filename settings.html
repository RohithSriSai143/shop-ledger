<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop Settings - Amount Adda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 400px;">
        <h3 class="text-center text-primary mb-3">Edit Shop Settings</h3>
        
        <form method="POST">
            <div class="mb-3">
                <label>Shop Name</label>
                <input type="text" name="shop_name" class="form-control" value="{{ user['shop_name'] }}" required>
            </div>
            <div class="mb-3">
                <label>Phone Number</label>
                <input type="text" name="phone" class="form-control" value="{{ user['number'] }}" required>
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" value="{{ user['email'] }}" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">Save Changes</button>
            <a href="/dashboard" class="btn btn-secondary w-100 text-center">Back to Dashboard</a>
        </form>
    </div>
</body>
</html>
