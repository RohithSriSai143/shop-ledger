<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot PIN - Amount Adda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 380px;">
        <h3 class="text-center text-primary mb-3">Reset PIN</h3>
        
        {% if error %}
            <div class="alert alert-danger py-2 text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label>Enter Registered Email or Phone Number</label>
                <input type="text" name="identifier" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">Verify & Continue</button>
            <a href="/" class="btn btn-secondary w-100 text-center">Back to Login</a>
        </form>
    </div>
</body>
</html>
