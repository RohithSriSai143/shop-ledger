<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amount Adda - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 380px;">
        <h3 class="text-center text-primary mb-3">Welcome to Amount Adda</h3>
        
        {% if error %}
            <div class="alert alert-danger py-2 text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label>Security PIN</label>
                <div class="input-group">
                    <!-- Name changed from 'pin' to 'password' to match app.py -->
                    <input type="password" name="password" id="pinBox" class="form-control" required>
                    <button type="button" class="btn btn-outline-secondary" onclick="togglePin()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-2">Login</button>
            <a href="/register" class="btn btn-secondary w-100 text-center">New User? Register Here</a>
        </form>

        <div class="text-center mt-3">
            <a href="/forgot_pin" class="text-decoration-none text-danger fw-bold">Forgot PIN? Click here</a>
        </div>
    </div>

    <!-- Password Show/Hide Toggle Script -->
    <script>
        function togglePin() {
            const pinBox = document.getElementById("pinBox");
            const eyeIcon = document.getElementById("eyeIcon");
            if (pinBox.type === "password") {
                pinBox.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                pinBox.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
