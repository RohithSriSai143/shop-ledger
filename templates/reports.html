<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Graphs & Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <div class="container my-4" style="max-width: 900px;">
        <!-- Header & Home Button -->
        <div class="card p-3 p-md-4 shadow mb-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h4 class="m-0 fs-5 fs-md-3">📊 Collection Analytics</h4>
                <a href="/dashboard" class="btn btn-success btn-sm btn-md">Home Page</a>
            </div>
        </div>

        <!-- Summary Cards Section (Weekly, Monthly, Yearly Totals) -->
        <div class="row text-white mb-4 g-2">
            <div class="col-12 col-md-4">
                <div class="card bg-primary p-3 shadow text-center">
                    <h6 class="mb-1">Weekly Total</h6>
                    <h4 class="mb-0 fs-5 fs-md-4">₹{{ "%.2f"|format(weekly_total) }}</h4>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card bg-success p-3 shadow text-center">
                    <h6 class="mb-1">Monthly Total</h6>
                    <h4 class="mb-0 fs-5 fs-md-4">₹{{ "%.2f"|format(monthly_total) }}</h4>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card bg-danger p-3 shadow text-center">
                    <h6 class="mb-1">Yearly Total</h6>
                    <h4 class="mb-0 fs-5 fs-md-4">₹{{ "%.2f"|format(yearly_total) }}</h4>
                </div>
            </div>
        </div>

        <!-- PDF Download Section -->
        <div class="card p-3 shadow mb-4 text-center bg-white">
            <div>
                <a href="/download_pdf" class="btn btn-danger w-100 w-md-auto">📥 Download PDF Report</a>
            </div>
        </div>

        <!-- Interactive Graph Section -->
        <div class="card p-3 p-md-4 shadow">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h5 class="text-primary m-0 fs-6 fs-md-5" id="graphTitle">📈 Collection Trend (Daily)</h5>
                <div class="btn-group flex-wrap" role="group">
                    <button class="btn btn-outline-primary btn-sm active" onclick="showGraph('daily', this)">Day</button>
                    <button class="btn btn-outline-primary btn-sm" onclick="showGraph('weekly', this)">Weekly</button>
                    <button class="btn btn-outline-primary btn-sm" onclick="showGraph('monthly', this)">Monthly</button>
                    <button class="btn btn-outline-primary btn-sm" onclick="showGraph('yearly', this)">Yearly</button>
                </div>
            </div>

            <!-- Custom Y-Axis Range Controls -->
            <div class="row mb-3 g-2 align-items-center bg-light p-2 rounded">
                <div class="col-12 col-sm-auto"><label class="fw-bold small">Y-Axis Max Range:</label></div>
                <div class="col">
                    <input type="number" id="yAxisMax" class="form-control form-control-sm" placeholder="e.g. 10000">
                </div>
                <div class="col-auto">
                    <button class="btn btn-sm btn-dark w-100" onclick="updateYAxis()">Set Range</button>
                </div>
            </div>

            <div class="chart-container" style="position: relative; height:300px; width:100%">
                <canvas id="collectionChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Data from Flask Backend
        const dailyLabels = {{ daily_dates | tojson }};
        const dailyData = {{ daily_totals | tojson }};

        const weeklyLabels = {{ weekly_labels | tojson }};
        const weeklyData = {{ weekly_data | tojson }};

        const monthlyLabels = {{ monthly_labels | tojson }};
        const monthlyData = {{ monthly_data | tojson }};

        const yearlyLabels = {{ yearly_labels | tojson }};
        const yearlyData = {{ yearly_data | tojson }};

        const ctx = document.getElementById('collectionChart').getContext('2d');
        let myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dailyLabels,
                datasets: [{
                    label: 'Collection Amount (₹)',
                    data: dailyData,
                    borderColor: 'rgba(13, 110, 253, 1)',
                    backgroundColor: 'rgba(13, 110, 253, 0.1)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { 
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return '₹' + value.toLocaleString();
                            }
                        }
                    }
                }
            }
        });

        function showGraph(type, btn) {
            document.querySelectorAll('.btn-outline-primary').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            let title = document.getElementById('graphTitle');
            if(type === 'daily') {
                title.innerText = "📈 Collection Trend (Daily)";
                myChart.data.labels = dailyLabels;
                myChart.data.datasets[0].data = dailyData;
            } else if(type === 'weekly') {
                title.innerText = "📈 Collection Trend (Weekly)";
                myChart.data.labels = weeklyLabels;
                myChart.data.datasets[0].data = weeklyData;
            } else if(type === 'monthly') {
                title.innerText = "📈 Collection Trend (Monthly)";
                myChart.data.labels = monthlyLabels;
                myChart.data.datasets[0].data = monthlyData;
            } else if(type === 'yearly') {
                title.innerText = "📈 Collection Trend (Yearly)";
                myChart.data.labels = yearlyLabels;
                myChart.data.datasets[0].data = yearlyData;
            }
            
            // Reset Y-axis max when switching views so it auto-scales nicely
            delete myChart.options.scales.y.max;
            document.getElementById('yAxisMax').value = '';
            myChart.update();
        }

        function updateYAxis() {
            let maxVal = document.getElementById('yAxisMax').value;
            if(maxVal) {
                myChart.options.scales.y.max = parseFloat(maxVal);
                myChart.update();
            }
        }
    </script>
</body>
</html>
