<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New PIN - Amount Adda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 380px;">
        <h3 class="text-center text-primary mb-3">Set New PIN</h3>
        
        <form method="POST">
            <div class="mb-3">
                <label>Enter New PIN</label>
                <input type="password" name="new_pin" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Update PIN</button>
        </form>
    </div>
</body>
</html>
