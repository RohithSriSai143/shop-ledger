<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP - Amount Adda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 380px;">
        <h3 class="text-center text-primary mb-3">Enter OTP</h3>
        <p class="text-muted text-center small">OTP has been sent (Check VS Code Terminal).</p>
        
        {% if error %}
            <div class="alert alert-danger py-2 text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label>Enter 4-Digit OTP</label>
                <input type="text" name="otp" class="form-control text-center fs-4" maxlength="4" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mb-2">Verify OTP</button>
            <a href="/forgot_pin" class="btn btn-secondary w-100 text-center">Back</a>
        </form>
    </div>
</body>
</html>
